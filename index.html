  <div class="modal" id="authModal">

      <input type="password" id="authPassword" placeholder="Password (8+ chars)">

      </button>
      <div id="authMsg"></div>

  <script>
    // Config
    const SUPABASE_URL = "https://tfkwctmewgsolcaphsbp.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRma3djdG1ld2dzb2xjYXBoc2JwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5NzgzMTksImV4cCI6MjA4NDU1NDMxOX0.ovEcqdGAbL0e-3KIElG0gFTIsTpcmHo_FuVb_S1eVOg";
    const STRIPE_PK = "pk_live_51SrWQV6ILDOjliDIgVHOujhKwwIvtl4zjH9BCCvh5c0U2sydcHKFIDAEdgmQZdCkRER1l9IydrEC5BYE5FLBYjVR00euV5fqz2";
    const BACKEND = "https://verify-backend-rzx1.onrender.com";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const st = Stripe(STRIPE_PK);
    
    let user = null;
    let file = null;
    let isLogin = true;

    // Check session on load
    sb.auth.getSession().then(r => {
      if (r.data.session) {
        user = r.data.session.user;
        document.getElementById('userInfo').innerHTML = '<div class="msg success">Signed in as: ' + user.email + '</div>';
        document.getElementById('signInBtn').textContent = 'Sign Out';
      }
    });

    // Sign In button
    document.getElementById('signInBtn').onclick = function() {
      if (user) {
        sb.auth.signOut().then(() => {
          user = null;
          document.getElementById('userInfo').innerHTML = '';
          document.getElementById('signInBtn').textContent = 'Sign In / Sign Up';
        });
      } else {
        document.getElementById('authModal').classList.add('active');
      }
    };

    // Toggle auth mode
    document.getElementById('toggleAuthBtn').onclick = function() {
      isLogin = !isLogin;
      document.getElementById('modalTitle').textContent = isLogin ? 'Sign In' : 'Sign Up';
      document.getElementById('toggleAuthBtn').textContent = isLogin ? 'Switch to Sign Up' : 'Switch to Sign In';
    };

    // Auth submit
    document.getElementById('authSubmitBtn').onclick = async function() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const msg = document.getElementById('authMsg');

      if (!email || password.length < 8) {
        msg.innerHTML = '<div class="msg error">Email required. Password 8+ chars.</div>';
        return;
      }

      try {
        if (isLogin) {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          user = data.user;
          document.getElementById('authModal').classList.remove('active');
          document.getElementById('userInfo').innerHTML = '<div class="msg success">Signed in!</div>';
          document.getElementById('signInBtn').textContent = 'Sign Out';
        } else {
          const { error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          msg.innerHTML = '<div class="msg success">Check your email!</div>';
        }
      } catch (err) {
        msg.innerHTML = '<div class="msg error">' + err.message + '</div>';
      }
    };

    // File input
    document.getElementById('fileInput').onchange = function(e) {
      file = e.target.files[0];
      if (file) {
        document.getElementById('scanBtn').disabled = false;
        document.getElementById('scanBtn').textContent = 'Scan ' + file.name;
      }
    };

    // Scan button
    document.getElementById('scanBtn').onclick = function() {
      if (!user) {
        alert('Please sign in first');
        return;
      }
      if (!file) {
        alert('Please select a file');
        return;
      }
      document.getElementById('scanResult').innerHTML = '<div class="msg success">Scan feature coming soon!</div>';
    };

    // Checkout function
    async function checkout(priceId, mode) {
      if (!user) {
        document.getElementById('authModal').classList.add('active');
        return;
      }

      const { data: session } = await sb.auth.getSession();
      
      try {
        const res = await fetch(BACKEND + '/create-checkout', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + session.session.access_token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ priceId, mode })
        });

        const data = await res.json();

        if (data.sessionId) {
          st.redirectToCheckout({ sessionId: data.sessionId });
        } else {
          alert('Error: ' + (data.error || 'Unknown'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Pricing buttons
    document.getElementById('buySingleBtn').onclick = () => checkout('price_1SrqvY6ILDOjliDIBaQcBzc3', 'payment');
    document.getElementById('buyPremiumBtn').onclick = () => checkout('price_1StYL46ILDOjliDIe0KBxUqf', 'subscription');
    document.getElementById('buyProBtn').onclick = () => checkout('price_1StYLe6ILDOjliDIZamQKL1Y', 'subscription');
    document.getElementById('buyPowerBtn').onclick = () => checkout('price_1StYMD6ILDOjliDI6gVqPr7J', 'subscription');
  </script>
