<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verifly</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .header { background: #667eea; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; }
    button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .sign-btn { background: white; color: #667eea; }
    .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 80px 20px; text-align: center; }
    .hero h1 { font-size: 48px; margin: 0 0 20px 0; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
    .modal-box { background: white; padding: 40px; border-radius: 20px; max-width: 400px; }
    .modal input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
    .modal button { width: 100%; background: #667eea; color: white; margin-top: 10px; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">Verifly</div>
  <button class="sign-btn" id="signInBtn">Sign In</button>
</div>

<div class="hero">
  <h1>Verify What's Real</h1>
  <p>AI-powered content detection</p>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Sign In</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="submitBtn">Continue</button>
  </div>
</div>

<script>
document.getElementById('signInBtn').onclick = function() {
  document.getElementById('modal').style.display = 'flex';
};

document.getElementById('submitBtn').onclick = function() {
  alert('Form submitted!');
};
</script>

</body>
</html>
