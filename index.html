<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verifly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      margin-top: 12px;
    }
    input[type="file"] {
      width: 100%;
      margin-top: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    .msg {
      margin-top: 14px;
      font-size: 14px;
    }
    .error { color: #f87171; }
    .success { color: #34d399; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }
    .link {
      margin-top: 12px;
      font-size: 14px;
      color: #60a5fa;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Verify an image</h2>

  <input type="file" id="imageInput" accept="image/*" />

  <button id="runScanBtn">Run Free Scan</button>

  <div id="status" class="msg"></div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="authModal">
  <div class="modal-box">
    <h3 id="authTitle">Create account</h3>

    <input id="emailInput" type="email" placeholder="Email" />
    <input id="passwordInput" type="password" placeholder="Password (8+ chars)" />

    <button id="authBtn">Continue</button>

    <div class="link" id="toggleAuth">
      Already have an account? Sign in
    </div>

    <div id="authMsg" class="msg"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://tfkwctmewgsolcaphsbp.supabase.co",
    "YOUR_PUBLIC_ANON_KEY"
  );

  const runScanBtn = document.getElementById("runScanBtn");
  const imageInput = document.getElementById("imageInput");
  const status = document.getElementById("status");

  const authModal = document.getElementById("authModal");
  const authBtn = document.getElementById("authBtn");
  const toggleAuth = document.getElementById("toggleAuth");
  const authTitle = document.getElementById("authTitle");
  const authMsg = document.getElementById("authMsg");

  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");

  let isLogin = false;

  function openAuth() {
    authModal.style.display = "flex";
  }

  function closeAuth() {
    authModal.style.display = "none";
  }

  toggleAuth.onclick = () => {
    isLogin = !isLogin;
    authTitle.textContent = isLogin ? "Sign in" : "Create account";
    authBtn.textContent = isLogin ? "Sign in" : "Continue";
    toggleAuth.textContent = isLogin
      ? "Need an account? Create one"
      : "Already have an account? Sign in";
    authMsg.textContent = "";
  };

  authBtn.onclick = async () => {
    authMsg.textContent = "";

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      authMsg.textContent = "Email and password required.";
      authMsg.className = "msg error";
      return;
    }

    if (password.length < 8) {
      authMsg.textContent = "Password must be at least 8 characters.";
      authMsg.className = "msg error";
      return;
    }

    let result;
    if (isLogin) {
      result = await supabase.auth.signInWithPassword({ email, password });
    } else {
      result = await supabase.auth.signUp({ email, password });
    }

    if (result.error) {
      authMsg.textContent = result.error.message;
      authMsg.className = "msg error";
      return;
    }

    if (isLogin) {
      closeAuth();
      status.textContent = "Signed in successfully.";
      status.className = "msg success";
    } else {
      authMsg.textContent = "Check your email to confirm your account.";
      authMsg.className = "msg success";
    }
  };

  // 🚨 SCAN LOGIC (NEW)
  runScanBtn.onclick = async () => {
    status.textContent = "";

    const { data } = await supabase.auth.getSession();
    const session = data.session;

    if (!session) {
      openAuth();
      return;
    }

    if (!imageInput.files.length) {
      status.textContent = "Please select an image first.";
      status.className = "msg error";
      return;
    }

    status.textContent = "Uploading image…";

    const file = imageInput.files[0];
    const path = `${session.user.id}/${Date.now()}-${file.name}`;

    const { error: uploadError } = await supabase
      .storage
      .from("scans")
      .upload(path, file);

    if (uploadError) {
      status.textContent = "Image upload failed.";
      status.className = "msg error";
      return;
    }

    const { data: urlData } = supabase
      .storage
      .from("scans")
      .getPublicUrl(path);

    status.textContent = "Running scan…";

    const res = await fetch(
      "https://verify-backend-rzx1.onrender.com/scan",
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${session.access_token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          imageUrl: urlData.publicUrl
        })
      }
    );

    if (res.status === 403) {
      status.textContent = "Free scan already used.";
      status.className = "msg error";
      return;
    }

    if (!res.ok) {
      status.textContent = "Scan failed.";
      status.className = "msg error";
      return;
    }

    status.textContent = "✅ Image accepted. Scan recorded.";
    status.className = "msg success";
  };

});
</script>

</body>
</html>
