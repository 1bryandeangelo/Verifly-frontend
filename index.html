<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verifly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    button {
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    .msg {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
    }
    .error { color: #f87171; }
    .success { color: #34d399; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    .link {
      margin-top: 12px;
      font-size: 14px;
      color: #60a5fa;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>

<body>

<div>
  <button id="runScanBtn">Run Free Scan</button>
  <div id="status" class="msg"></div>
</div>

<div class="modal" id="authModal">
  <div class="modal-box">
    <h3 id="authTitle">Create account</h3>

    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (8+ chars)" />

    <button id="authBtn" style="margin-top:14px;">Continue</button>

    <div class="link" id="toggleAuth">
      Already have an account? Sign in
    </div>

    <div id="authMsg" class="msg"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://tfkwctmewgsolcaphsbp.supabase.co",
    "YOUR_PUBLIC_ANON_KEY"
  );

  const runScanBtn = document.getElementById("runScanBtn");
  const status = document.getElementById("status");
  const authModal = document.getElementById("authModal");
  const authBtn = document.getElementById("authBtn");
  const toggleAuth = document.getElementById("toggleAuth");
  const authTitle = document.getElementById("authTitle");
  const authMsg = document.getElementById("authMsg");

  let isLogin = false;

  function openAuth() {
    authModal.style.display = "flex";
  }

  function closeAuth() {
    authModal.style.display = "none";
  }

  toggleAuth.onclick = () => {
    isLogin = !isLogin;
    authTitle.textContent = isLogin ? "Sign in" : "Create account";
    authBtn.textContent = isLogin ? "Sign in" : "Continue";
    toggleAuth.textContent = isLogin
      ? "Need an account? Create one"
      : "Already have an account? Sign in";
    authMsg.textContent = "";
  };

  authBtn.onclick = async () => {
    authMsg.textContent = "";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (password.length < 8) {
      authMsg.textContent = "Password must be at least 8 characters.";
      authMsg.className = "msg error";
      return;
    }

    if (isLogin) {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authMsg.textContent = error.message;
        authMsg.className = "msg error";
      } else {
        closeAuth();
        status.textContent = "Signed in successfully.";
        status.className = "msg success";
      }
    } else {
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        authMsg.textContent = error.message;
        authMsg.className = "msg error";
      } else {
        authMsg.textContent = "Check your email to confirm your account.";
        authMsg.className = "msg success";
      }
    }
  };

  runScanBtn.onclick = async () => {
    status.textContent = "";

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      openAuth();
      return;
    }

    const res = await fetch(
      "https://verify-backend-rzx1.onrender.com/scan",
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${session.access_token}`
        }
      }
    );

    if (res.status === 403) {
      status.textContent = "Free scan already used. Upgrade required.";
      status.className = "msg error";
      return;
    }

    if (!res.ok) {
      status.textContent = "Scan failed.";
      status.className = "msg error";
      return;
    }

    status.textContent = "✅ Free scan allowed";
    status.className = "msg success";
  };

});
</script>

</body>
</html>
