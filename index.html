<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verifly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    button {
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    input[type=file] {
      margin-top: 12px;
      width: 100%;
    }
    .msg {
      margin-top: 14px;
      font-size: 14px;
    }
    .error { color: #f87171; }
    .success { color: #34d399; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    .link {
      margin-top: 12px;
      font-size: 14px;
      color: #60a5fa;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Verify an image</h2>
  <input type="file" id="imageInput" accept="image/*" />
  <button id="runScanBtn">Run Free Scan</button>
  <div id="status" class="msg"></div>
</div>

<div class="modal" id="authModal">
  <div class="modal-box">
    <h3 id="authTitle">Create account</h3>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (8+ chars)" />
    <button id="authBtn">Continue</button>
    <div class="link" id="toggleAuth">Already have an account? Sign in</div>
    <div id="authMsg" class="msg"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://tfkwctmewgsolcaphsbp.supabase.co",
    "YOUR_PUBLIC_ANON_KEY"
  );

  const runScanBtn = document.getElementById("runScanBtn");
  const imageInput = document.getElementById("imageInput");
  const status = document.getElementById("status");

  const authModal = document.getElementById("authModal");
  const authBtn = document.getElementById("authBtn");
  const toggleAuth = document.getElementById("toggleAuth");
  const authTitle = document.getElementById("authTitle");
  const authMsg = document.getElementById("authMsg");

  let isLogin = false;

  function openAuth() { authModal.style.display = "flex"; }
  function closeAuth() { authModal.style.display = "none"; }

  toggleAuth.onclick = () => {
    isLogin = !isLogin;
    authTitle.textContent = isLogin ? "Sign in" : "Create account";
    authBtn.textContent = isLogin ? "Sign in" : "Continue";
    toggleAuth.textContent = isLogin
      ? "Need an account? Create one"
      : "Already have an account? Sign in";
    authMsg.textContent = "";
  };

  authBtn.onclick = async () => {
  alert("AUTH BUTTON CLICKED");

  authMsg.textContent = "";

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const email = emailInput.value;
  const password = passwordInput.value;

    if (password.length < 8) {
      authMsg.textContent = "Password must be at least 8 characters.";
      authMsg.className = "msg error";
      return;
    }

    const fn = isLogin
      ? supabase.auth.signInWithPassword
      : supabase.auth.signUp;

    const { error } = await fn({ email, password });
    if (error) {
      authMsg.textContent = error.message;
      authMsg.className = "msg error";
    } else {
      authMsg.textContent = isLogin
        ? "Signed in."
        : "Check your email to confirm.";
      authMsg.className = "msg success";
      if (isLogin) closeAuth();
    }
  };

  authBtn.onclick = async () => {
  authMsg.textContent = "";
  authMsg.className = "msg";

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    authMsg.textContent = "Email and password are required.";
    authMsg.className = "msg error";
    return;
  }

  if (password.length < 8) {
    authMsg.textContent = "Password must be at least 8 characters.";
    authMsg.className = "msg error";
    return;
  }

  authMsg.textContent = isLogin
    ? "Signing in…"
    : "Creating account…";

  let result;

  if (isLogin) {
    result = await supabase.auth.signInWithPassword({
      email,
      password
    });
  } else {
    result = await supabase.auth.signUp({
      email,
      password
    });
  }

  const { data, error } = result;

  if (error) {
    authMsg.textContent = error.message;
    authMsg.className = "msg error";
    return;
  }

  if (!isLogin) {
    authMsg.textContent =
      "Account created. Check your email to confirm.";
    authMsg.className = "msg success";
    return;
  }

  // Login success
  closeAuth();
  status.textContent = "Signed in successfully.";
  status.className = "msg success";
};

});
</script>

</body>
</html>
